# Complete dwoagent rewrite profile configuration.
# Resource files use fixed paths under this profile directory:
#   resource/prompts/System.md   required
#   resource/prompts/AGENTS.md   optional
#   resource/skills/*/SKILL.md   optional

# full_access | confirm | watch
policyMode: confirm

# Additional skills directories. Relative paths are resolved from this profile root.
externalSkillsDirs: []

# Daemon diagnostics are structured JSONL files under logs/. DWO_LOG
# can temporarily override the configured level with tracing filter directives.
logging:
  # error | warn | info | debug | trace
  level: info

  # Daily files retained on disk. Valid range: 1..=365.
  retentionDays: 14

# Channel credentials and mutable state are daemon-owned files under
# channels/<name>/{secret,runtime}.yaml and never belong in profile.yaml.
channels:
  weixin:
    # The configured channel is listed even when disabled, but its gateway only
    # starts when enabled and valid QR-login credentials have been persisted.
    enabled: false

    # Number of completed turns replayed after selecting an existing session.
    # Valid range: 0..=10.
    replayTurns: 5

  telegram:
    # Telegram support is private-chat only. The daemon owns one long-polling
    # runtime when enabled, bound, and the token environment variable exists.
    enabled: false

    # Number of completed turns replayed after selecting an existing session.
    # Valid range: 0..=10.
    replayTurns: 5

    # Environment variable containing the BotFather token.
    botTokenEnv: TELEGRAM_BOT_TOKEN

    # Optional HTTP proxy used only for Telegram Bot API and media downloads.
    tgProxy: null

  feishu:
    # Feishu/Lark support uses the platform WebSocket long connection and is
    # restricted to the single private user established by `dwo channel
    # feishu bind`.
    enabled: false

    # Number of completed turns replayed after selecting an existing session.
    # Valid range: 0..=10.
    replayTurns: 5

    # Environment variables containing enterprise application credentials.
    appIdEnv: FEISHU_APP_ID
    appSecretEnv: FEISHU_APP_SECRET

    # feishu uses open.feishu.cn; lark uses open.larksuite.com.
    platform: feishu

  qq:
    # QQ Bot is private C2C only. Credentials are persisted by QR binding in
    # channels/qq/secret.yaml; there are no App ID/Secret fields here.
    enabled: false

    # Number of completed turns replayed after selecting an existing session.
    # Valid range: 0..=10.
    replayTurns: 5


# Remote ACP and management RPC. Tokens are generated under
# runtime/websocket/secret.yaml and never belong in profile.yaml.
websocket:
  enabled: false
  bind: 127.0.0.1
  port: 8787

model:
  # Stable provider/modelId selection. Reasoning is optional.
  default:
    model: deepseek/deepseek-v4-pro
    reasoning: high

  # Optional default model for new subsessions. Omit it so children inherit
  # the model of the session that created them.
  # subagent:
  #   model: deepseek/deepseek-flash
  #   reasoning: low

  # Agent context policy default; an explicit provider model may override it.
  compactionTriggerRatio: 0.5

  # An official family name supplies its base URL and complete model list.
  providers:
    deepseek:
      # apiKey takes precedence over apiKeyEnv. Prefer apiKeyEnv.
      apiKeyEnv: DEEPSEEK_API_KEY
      apiKey: null
