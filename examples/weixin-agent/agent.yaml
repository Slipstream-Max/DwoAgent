agent_id: weixin-agent
name: weixin-agent
description: Weixin single-user assistant example
policy_mode: full_access
tools:
  file_edit: enable
  terminal: enable
  subagent: disable
model:
  default_model_id: deepseek-v4-flash
  models:
    - model_name: deepseek-v4-flash
      provider: deepseek
      model_id: deepseek-v4-flash
      api_key_env: DEEPSEEK_API_KEY
      default_reasoning_mode: auto
      compact_threshold: 0.8
    - model_name: deepseek-v4-pro
      provider: deepseek
      model_id: deepseek-v4-pro
      api_key_env: DEEPSEEK_API_KEY
      default_reasoning_mode: high
      compact_threshold: 0.8
policy:
  terminal:
    deny:
      - regex: '(?i)^\s*git\s+reset\s+--hard\b'
      - regex: '(?i)^\s*git\s+clean\s+-[^\s]*[fd]\b'
      - regex: '(?i)\bRemove-Item\b.*\b-Recurse\b'
      - regex: '(?i)\brm\b.*\s-rf\b'
    allow:
      - exact: git status
      - prefix: git diff
      - prefix: git show
      - prefix: git log
      - prefix: rg
      - prefix: cargo check
      - prefix: cargo test
    watch_allow:
      - exact: git status
      - prefix: git diff
      - prefix: git show
      - prefix: git log
      - prefix: rg
      - prefix: Get-Content
      - prefix: Select-String
      - prefix: Get-ChildItem
channels:
  weixin:
    enabled: true
    workspace_dir: .
    markdown_filter: true
    media_input: true
    media_output: true
    override_model: deepseek-v4-pro
    override_reasoning_mode: high
