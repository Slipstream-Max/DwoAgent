# dwo-agent 完整 agent.yaml 选项模板
#
# 用法：
# 1. 复制本文件为 agent.yaml，或者从这里挑字段复制到现有 agent.yaml。
# 2. 删除不需要的字段。
# 3. 注释里的 "可选值" 是当前代码支持的全部枚举值。
#
# 注意：
# - YAML 不能给同一个 key 同时写多个值；所以本文件只保留一个实际值，其它可能值写在注释里。
# - 本文件默认关闭 channels 和 automation，避免误启动外部入口。

# 必填。Agent 唯一 id。
agentId: dwo-agent

# 必填。显示名称。
name: dwo-agent

# 必填。简短描述。
description: Dwo Agent runtime

# 可选。最大 agent loop 轮数。
# 可选值：
# - null：不设置上限
# - 正整数：例如 1、3、10
maxRunningTurn: null

# 必填。默认权限模式。
# 可选值：
# - full_access：尽量直接执行；terminal 仍会被 policy.terminal.deny 拦住
# - confirm：需要确认；命中 policy.terminal.allow 的简单 terminal 命令可直接执行
# - watch：只允许 policy.terminal.watchAllow 里的简单 terminal 命令，其它拒绝
policyMode: confirm

# 可选。普通会话存储目录。相对路径按 agent folder 解析。
sessionStoreDir: runtime/sessions

# Channel routing/state 固定写入 runtime/channel_state，不提供配置项。

# 可选。额外 skills 根目录列表。相对路径按 agent folder 解析。
# 示例：
# externalSkillsDirs:
#   - ../shared/skills
externalSkillsDirs: []

# 可选。额外 rule 文件列表。相对路径按 agent folder 解析。
# 示例：
# externalRuleFiles:
#   - ../shared/AGENTS.md
externalRuleFiles: []

# 可选。内置工具开关。
# 每个工具的可选值：
# - enable
# - disable
tools:
  fileEdit: enable
  terminal: enable
  subagent: enable

model:
  # 必填。默认模型别名，必须等于 models[*].modelName 中的一个。
  defaultModelId: deepseek-v4-pro

  # 必填。可用模型列表。
  models:
    - modelName: deepseek-v4-pro

      # 必填。Provider id。
      # 当前可选值：
      # - deepseek
      provider: deepseek

      # 必填。Provider 模型 id。
      # provider=deepseek 当前可选值：
      # - deepseek-v4-pro
      # - deepseek-v4-flash
      modelId: deepseek-v4-pro

      # 可选。API key 来源，二选一或都留空：
      # - apiKeyEnv：从环境变量读
      # - apiKey：直接写 key
      apiKeyEnv: DEEPSEEK_API_KEY
      apiKey: null

      # 可选。覆盖 provider 默认 base URL。
      # deepseek 默认：https://api.deepseek.com
      apiBase: null

      # 可选。请求参数。null 表示使用 provider/model 默认值。
      temperature: null
      topP: null
      timeoutSeconds: null
      maxTokens: null

      # 可选。默认 reasoning mode。
      # deepseek-v4-pro 当前可选值：
      # - auto
      # - nonthink
      # - high
      # - max
      defaultReasoningMode: high

      # 可选。上下文压缩阈值，范围 (0, 1]。
      compactThreshold: 0.8

    - modelName: deepseek-v4-flash
      provider: deepseek
      modelId: deepseek-v4-flash
      apiKeyEnv: DEEPSEEK_API_KEY
      apiKey: null
      apiBase: null
      temperature: null
      topP: null
      timeoutSeconds: null
      maxTokens: null
      # deepseek-v4-flash 当前可选值：auto | nonthink | high | max
      defaultReasoningMode: max
      compactThreshold: 0.8

# 可选。工具策略。
# 当前只支持 terminal 子项。
policy:
  terminal:
    # terminal.deny / allow / watchAllow 的每一项都支持以下 4 种写法：
    # - git status                  # bare string，等价于 exact
    # - exact: git status           # 精确匹配，忽略大小写和多余空白
    # - prefix: git diff            # 命令前缀匹配，忽略大小写
    # - regex: '(?i)^git reset\b'   # Rust regex

    # 命中 deny：直接拒绝。
    deny:
      - regex: '(?i)^\s*git\s+reset\s+--hard\b'
      - regex: '(?i)^\s*git\s+clean\s+-[^\s]*[fd]\b'
      - regex: '(?i)\bRemove-Item\b.*\b-Recurse\b'
      - regex: '(?i)\brm\b.*\s-rf\b'

    # policyMode=confirm 时，命中 allow 且是单条简单 terminal 命令：直接执行。
    allow:
      - git status
      - exact: git status
      - prefix: git diff
      - prefix: git show
      - prefix: git log
      - prefix: rg
      - prefix: cargo check
      - prefix: cargo test

    # policyMode=watch 时，命中 watchAllow 且是单条简单 terminal 命令：允许执行。
    watchAllow:
      - exact: git status
      - prefix: git diff
      - prefix: git show
      - prefix: git log
      - prefix: rg
      - prefix: Get-Content
      - prefix: Select-String
      - prefix: Get-ChildItem

# 可选。`dwoagent agent run` 模式下的外部 channel。
# ACP stdio 使用 `dwoagent supervisor acp --agent-profile <path>`，不写入 agent.yaml。
# 桌面/UI WebSocket 属于 supervisor，也不写入 agent.yaml。
channels:
  weixin:
    # 可选值：true | false
    enabled: false

    # 工作目录。相对路径按 agent folder 解析。
    workspaceDir: .

    # 是否过滤/转换 markdown。
    # 可选值：true | false
    markdownFilter: true

    # 是否接收媒体输入。
    # 可选值：true | false
    mediaInput: false

    # 是否允许模型用 weixin_reply_media 回复媒体。
    # 可选值：true | false
    mediaOutput: false

    # channel 返回内容详细程度。
    # 可选值：
    # - response_only：只返回最终回答
    # - detailed：返回 thinking/tool_call 摘要 + 最终回答
    responseDetail: response_only

    # 新建默认 session 时覆盖模型。
    # 可选值：
    # - null：使用 model.defaultModelId
    # - 任意 models[*].modelName，例如 deepseek-v4-pro、deepseek-v4-flash
    overrideModel: null

    # 新建默认 session 时覆盖 reasoning mode。
    # 可选值：
    # - null
    # - auto
    # - nonthink
    # - high
    # - max
    overrideReasoningMode: null

    # 固定默认普通 session。
    # 可选值：
    # - null：首次消息自动创建
    # - 已存在 sessionId
    defaultSessionId: null

  feishu:
    # 可选值：true | false
    enabled: false

    # 工作目录。相对路径按 agent folder 解析。
    workspaceDir: .

    # 飞书域。
    # 可选值：
    # - feishu
    # - lark
    domain: feishu

    # 私聊访问策略。
    # 可选值：
    # - allow_all
    # - white_list
    dmPolicy: white_list

    # 群聊访问策略。
    # 可选值：
    # - allow_all
    # - white_list
    groupPolicy: white_list

    # 私聊白名单。dmPolicy=white_list 时使用。
    # 可写 user/open_id 等实际 channel 传入的 sender id；"*" 也可作为配置约定使用。
    allowFrom: []

    # 群聊白名单。groupPolicy=white_list 时使用。
    groupAllowFrom: []

    # 群聊是否要求 @ bot。
    # 可选值：true | false
    groupRequireMention: true

    # 是否接收媒体输入。
    # 可选值：true | false
    mediaInput: false

    # 是否允许模型用 feishu_reply_media 回复媒体。
    # 可选值：true | false
    mediaOutput: false

    # 是否允许模型用 feishu_reply_card 回复卡片。
    # 可选值：true | false
    cardOutput: false

    # 可选值：response_only | detailed
    responseDetail: response_only

    # 可选值：null | models[*].modelName
    overrideModel: null

    # 可选值：null | auto | nonthink | high | max
    overrideReasoningMode: null

    # 可选值：null | 已存在 sessionId
    defaultSessionId: null

# 可选。agent run 模式下的定时任务。
automation:
  # 可选值：true | false
  enabled: false

  jobs:
    # session.mode 可选值之一：new
    # schedule.type 可选值之一：interval
    - id: example_interval_new
      # 可选值：true | false
      enabled: false
      workspaceDir: .
      session:
        mode: new
      schedule:
        type: interval
        everySeconds: 3600
      prompt: "Summarize the current project status."
      # 可选值：response_only | detailed
      responseDetail: response_only
      notify:
        # notify.channel 可选值：weixin | feishu
        - channel: weixin
          # recipient 可选。Weixin 当前通知实现不要求 recipient。
          recipient: null

    # session.mode 可选值之一：fixed
    # schedule.type 可选值之一：daily
    - id: example_daily_fixed
      enabled: false
      workspaceDir: .
      session:
        mode: fixed
        sessionId: replace-with-existing-session-id
      schedule:
        type: daily
        # 可选格式：
        # - HH:MM
        # - HH:MM:SS
        at: "09:00"
      prompt: "Run the daily fixed-session task."
      responseDetail: detailed
      notify:
        - channel: feishu
          # Feishu 通知需要 recipient。
          recipient:
            # recipient.type 没有限制枚举，原样传给通知记录；常用 chat/user。
            type: chat
            id: replace-with-feishu-chat-id

    # session.mode 可选值之一：sticky
    - id: example_interval_sticky
      enabled: false
      workspaceDir: .
      session:
        mode: sticky
      schedule:
        type: interval
        everySeconds: 86400
      prompt: "Run the sticky-session task."
      responseDetail: response_only
      notify: []
