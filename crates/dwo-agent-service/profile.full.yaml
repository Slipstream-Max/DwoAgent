# Complete dwoagent rewrite profile configuration.
# Resource files use fixed paths under this profile directory:
#   resource/prompts/System.md   required
#   resource/prompts/AGENTS.md   optional
#   resource/skills/*/SKILL.md   optional
#   resource/mcp.json            optional

name: coder
description: coding agent

# full_access | confirm | watch
policyMode: confirm

# Daemon diagnostics are structured JSONL files under runtime/logs. DWO_LOG
# can temporarily override the configured level with tracing filter directives.
logging:
  # error | warn | info | debug | trace
  level: info

  # Daily files retained on disk. Valid range: 1..=365.
  retentionDays: 14

# Channel credentials and mutable state are daemon-owned files under
# channels/<name>/{secret,runtime}.yaml and never belong in profile.yaml.
channels:
  weixin:
    # The configured channel is listed even when disabled, but its gateway only
    # starts when enabled and valid QR-login credentials have been persisted.
    enabled: false

    # Number of completed turns replayed after selecting an existing session.
    # Valid range: 0..=10.
    replayTurns: 5

    # Apply the Weixin markdown compatibility filter to assistant responses.
    markdownFilter: true

    # Download inbound images/files and submit structured content blocks.
    mediaInput: true

  telegram:
    # Telegram support is private-chat only. The daemon owns one long-polling
    # runtime when enabled, bound, and the token environment variable exists.
    enabled: false

    # Number of completed turns replayed after selecting an existing session.
    # Valid range: 0..=10.
    replayTurns: 5

    # Environment variable containing the BotFather token.
    botTokenEnv: TELEGRAM_BOT_TOKEN

    # Optional HTTP proxy used only for Telegram Bot API and media downloads.
    tgProxy: null

    # Download inbound photos, documents, and videos as structured resources.
    mediaInput: true

  feishu:
    # Feishu/Lark support uses the platform WebSocket long connection and is
    # restricted to the single private user established by `dwo channel
    # feishu bind`.
    enabled: false

    # Number of completed turns replayed after selecting an existing session.
    # Valid range: 0..=10.
    replayTurns: 5

    # Environment variables containing enterprise application credentials.
    appIdEnv: FEISHU_APP_ID
    appSecretEnv: FEISHU_APP_SECRET

    # feishu uses open.feishu.cn; lark uses open.larksuite.com.
    platform: feishu

    # Download inbound images and files as structured resources.
    mediaInput: true

  websocket:
    # ACP over WebSocket listens on all interfaces at /acp. A persistent
    # access token is generated under channels/websocket/secret.yaml.
    enabled: false
    port: 8765

# The daemon watches this section and reschedules valid changes automatically.
# Cron uses the standard five fields: minute hour day-of-month month weekday.
automation:
  enabled: false
  # After this many seconds, the active turn is told to stop using tools and answer.
  timeoutSeconds: 900
  jobs:
    - name: daily-report
      enabled: true
      schedule:
        cron: "0 9 * * *"
        timezone: Asia/Shanghai
      session:
        mode: new
        behavior: every_time
        cwd: .
        title: Daily report
      prompt: Summarize the current project status.

    # A fixed job uses normal FIFO prompt semantics and never interrupts an active turn.
    - name: continue-fixed-session
      enabled: false
      schedule:
        cron: "*/30 * * * *"
        timezone: local
      session:
        mode: fixed
        sessionId: session-replace-me
      prompt: Continue the scheduled task.

model:
  # Must match one models[*].modelName.
  defaultModelId: deepseek-v4-pro

  # Provider instances select a catalog provider and provide credentials.
  # Transport policy, headers and request fields stay in the model catalog.
  providers:
    deepseek:
      # Provider type from dwo-model-client/resources/providers/*.yaml.
      type: deepseek

      # Optional complete Chat Completions URL override.
      # The catalog endpoint is used when omitted.
      baseUrl: null

      # apiKey takes precedence over apiKeyEnv. Prefer apiKeyEnv.
      apiKeyEnv: DEEPSEEK_API_KEY
      apiKey: null

  # Session-visible model aliases. Optional values override the selected
  # catalog model. Reasoning request parameters and capabilities stay catalog-owned.
  models:
    - modelName: deepseek-v4-pro
      provider: deepseek
      modelId: deepseek-v4-pro

      # Optional model-level overrides.
      contextWindowTokens: 1000000
      maxOutputTokens: 384000
      compactThreshold: 0.5
      defaultReasoningMode: high

    - modelName: deepseek-v4-flash
      provider: deepseek
      modelId: deepseek-v4-flash
