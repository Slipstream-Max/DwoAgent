terminal:
  deny:
    - regex: '(?i)^\s*git\s+reset\s+--hard\b'
    - regex: '(?i)^\s*git\s+clean\s+-[^\s]*[fd]\b'
    - regex: '(?i)\bRemove-Item\b.*\b-Recurse\b'
    - regex: '(?i)\brm\b.*\s-rf\b'
  allow:
    - exact: git status
    - prefix: git diff
    - prefix: git show
    - prefix: git log
    - prefix: rg
    - prefix: cargo check
    - prefix: cargo test
  watch_allow:
    - exact: git status
    - prefix: git diff
    - prefix: git show
    - prefix: git log
    - prefix: rg
    - prefix: Get-Content
    - prefix: Select-String
    - prefix: Get-ChildItem
