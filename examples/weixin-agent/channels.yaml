stdio:
  enabled: false
  auth: true

weixin:
  enabled: true
  workspace_dir: .
  markdown_filter: true
  media_input: true
  media_output: true
  override_model: deepseek-v4-pro
  override_reasoning_mode: high

websocket:
  enabled: false
  bind_addr: 127.0.0.1:8765
  auth: true

automation:
  enabled: false
  jobs:
    - id: daily_digest
      enabled: true
      workspace_dir: .
      schedule:
        type: interval
        every_seconds: 3600
      prompt: "总结当前项目状态。"
      notify:
        - channel: weixin
