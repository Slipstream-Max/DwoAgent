agentId: weixin-agent
name: weixin-agent
description: Weixin single-user assistant example
policyMode: full_access
tools:
  fileEdit: enable
  terminal: enable
  subagent: disable
model:
  defaultModelId: deepseek-v4-flash
  models:
    - modelName: deepseek-v4-flash
      provider: deepseek
      modelId: deepseek-v4-flash
      apiKeyEnv: DEEPSEEK_API_KEY
      defaultReasoningMode: auto
      compactThreshold: 0.8
    - modelName: deepseek-v4-pro
      provider: deepseek
      modelId: deepseek-v4-pro
      apiKeyEnv: DEEPSEEK_API_KEY
      defaultReasoningMode: high
      compactThreshold: 0.8
policy:
  terminal:
    deny:
      - regex: '(?i)^\s*git\s+reset\s+--hard\b'
      - regex: '(?i)^\s*git\s+clean\s+-[^\s]*[fd]\b'
      - regex: '(?i)\bRemove-Item\b.*\b-Recurse\b'
      - regex: '(?i)\brm\b.*\s-rf\b'
    allow:
      - exact: git status
      - prefix: git diff
      - prefix: git show
      - prefix: git log
      - prefix: rg
      - prefix: cargo check
      - prefix: cargo test
    watchAllow:
      - exact: git status
      - prefix: git diff
      - prefix: git show
      - prefix: git log
      - prefix: rg
      - prefix: Get-Content
      - prefix: Select-String
      - prefix: Get-ChildItem
channels:
  weixin:
    enabled: true
    workspaceDir: .
    markdownFilter: true
    mediaInput: true
    mediaOutput: true
    overrideModel: deepseek-v4-pro
    overrideReasoningMode: high
