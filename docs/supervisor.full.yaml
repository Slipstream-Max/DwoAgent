# dwoagent 完整 supervisor.yaml 选项模板
#
# 默认路径：~/.dwoagent/supervisor.yaml
# 创建命令：dwoagent create supervisor --default
#
# 注意：supervisor 是机器级 daemon 配置，不属于某个 agent profile。

# 必填/可选。配置版本。当前固定为 1。
version: 1

# 必填/可选。桌面 UI / shim 连接 supervisor 的入口。
endpoint:
  # 可选。WebSocket 监听地址。
  # 默认值：127.0.0.1:8766
  websocket_bind_addr: 127.0.0.1:8766

  # 可选。请求鉴权 secret。
  # 默认由 create supervisor 生成 dwo_sup_xxx。
  # 留空字符串表示不校验，建议只在开发时使用。
  secret: dwo_sup_replace_me

# 可选。profile 注册表。
# supervisor 只会调度这里声明的 profile。
profiles:
  # 必填。请求里使用的 profile id。
  - id: coder

    # 必填。agent profile 目录，目录内应包含 agent.yaml。
    path: C:\Users\you\.dwoagent\profiles\coder

  # 可以注册多个 profile。
  - id: writer
    path: C:\Users\you\.dwoagent\profiles\writer

# 可选。请求未显式带 profile 时使用的默认 profile。
# 可选值：null 或 profiles[*].id
# 如果为 null，所有 worker.request 都必须带 profile。
default_profile: coder

# 可选。worker 池配置。
pool:
  # 可选。最多保留多少个 profile host。
  # 默认值：3
  max_workers: 3

  # 可选。worker 空闲多少秒后回收。
  # 默认值：600
  idle_seconds: 600
