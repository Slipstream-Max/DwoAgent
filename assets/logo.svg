<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">赤铎 Dwo Agent</title>
  <desc id="desc">A dark steel Chinese bell in front of a rust-red industrial gear.</desc>
  <defs>
    <linearGradient id="gear" x1="220" y1="512" x2="804" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ad472c"/>
      <stop offset="0.46" stop-color="#a34229"/>
      <stop offset="0.56" stop-color="#9d3d25"/>
      <stop offset="1" stop-color="#8f351f"/>
    </linearGradient>
    <linearGradient id="bell" x1="300" y1="510" x2="725" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#596173"/>
      <stop offset="0.46" stop-color="#505a6b"/>
      <stop offset="0.56" stop-color="#46515f"/>
      <stop offset="1" stop-color="#3f4a55"/>
    </linearGradient>
    <linearGradient id="bow" x1="372" y1="576" x2="651" y2="576" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aeb7bc"/>
      <stop offset="0.5" stop-color="#abb8be"/>
      <stop offset="1" stop-color="#b2b9c1"/>
    </linearGradient>
    <radialGradient id="rivet" cx="38%" cy="32%" r="68%">
      <stop offset="0" stop-color="#e4ae58"/>
      <stop offset="0.72" stop-color="#dca451"/>
      <stop offset="1" stop-color="#c88a3d"/>
    </radialGradient>
    <filter id="gear-shadow" x="-8%" y="-8%" width="116%" height="118%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#6b2419" flood-opacity="0.28"/>
    </filter>
    <filter id="bell-shadow" x="-6%" y="-6%" width="112%" height="114%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#202936" flood-opacity="0.34"/>
    </filter>
    <filter id="rivet-shadow" x="-35%" y="-35%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#5a3d24" flood-opacity="0.38"/>
    </filter>
    <clipPath id="gear-crop">
      <rect width="1024" height="670"/>
    </clipPath>
    <path id="tooth" d="M498 220c-5 0-8 3-10 9l-10 37c-1 5-5 8-10 9l-18 5h124l-18-5c-5-1-9-4-10-9l-10-37c-2-6-5-9-10-9z"/>
    <clipPath id="gear-teeth" clipPathUnits="userSpaceOnUse">
      <use href="#tooth"/>
      <use href="#tooth" transform="rotate(24 512 512)"/>
      <use href="#tooth" transform="rotate(48 512 512)"/>
      <use href="#tooth" transform="rotate(72 512 512)"/>
      <use href="#tooth" transform="rotate(96 512 512)"/>
      <use href="#tooth" transform="rotate(120 512 512)"/>
      <use href="#tooth" transform="rotate(240 512 512)"/>
      <use href="#tooth" transform="rotate(264 512 512)"/>
      <use href="#tooth" transform="rotate(288 512 512)"/>
      <use href="#tooth" transform="rotate(312 512 512)"/>
      <use href="#tooth" transform="rotate(336 512 512)"/>
    </clipPath>
    <path id="bell-shape" d="M485 312h54c15 0 24 10 24 26v73h32c34 0 55 16 64 48l66 333c3 14-5 18-15 10-57-32-126-50-198-50s-141 18-198 50c-10 8-18 4-15-10l70-333c7-31 29-48 62-48h30v-73c0-16 9-26 24-26z"/>
  </defs>

  <rect width="1024" height="1024" fill="#fff"/>

  <g filter="url(#gear-shadow)">
    <g clip-path="url(#gear-teeth)">
      <rect width="1024" height="1024" fill="url(#gear)"/>
    </g>
    <path d="M512 274a238 238 0 1 1 0 476 238 238 0 1 1 0-476zm0 27a211 211 0 1 0 0 422 211 211 0 1 0 0-422z" fill="url(#gear)" fill-rule="evenodd" clip-path="url(#gear-crop)"/>
    <circle cx="512" cy="512" r="194" fill="none" stroke="url(#gear)" stroke-width="11"/>
  </g>

  <use href="#bell-shape" fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round"/>
  <use href="#bell-shape" fill="url(#bell)" filter="url(#bell-shadow)"/>

  <path d="M382 576c84 24 176 24 260 0" fill="none" stroke="url(#bow)" stroke-width="19" stroke-linecap="round"/>

  <g fill="url(#rivet)" filter="url(#rivet-shadow)">
    <circle cx="422" cy="477" r="10.8"/>
    <circle cx="602" cy="477" r="10.8"/>
    <circle cx="413" cy="527" r="10.8"/>
    <circle cx="611" cy="527" r="10.8"/>
    <circle cx="394" cy="633" r="10.6"/>
    <circle cx="630" cy="633" r="10.6"/>
    <circle cx="385" cy="685" r="10.6"/>
    <circle cx="639" cy="685" r="10.6"/>
  </g>

  <path d="M306 800c55-45 126-69 206-69s151 24 206 69c-61-37-130-61-206-61s-145 24-206 61z" fill="#fff"/>
</svg>
